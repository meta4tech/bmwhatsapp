<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Gambar ke URL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .header {
            background: linear-gradient(90deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .description {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .upload-container {
            border: 2px dashed #4361ee;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
            background-color: #f8faff;
            position: relative;
        }
        
        .upload-container.dragover {
            background-color: #e6eeff;
            border-color: #2a4dff;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 50px;
            color: #4361ee;
            margin-bottom: 15px;
        }
        
        .upload-container p {
            margin-bottom: 15px;
            color: #666;
            font-size: 18px;
        }
        
        .file-input {
            display: none;
        }
        
        .browse-btn {
            background: linear-gradient(90deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }
        
        .browse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(67, 97, 238, 0.4);
        }
        
        .preview-container {
            display: none;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .preview-title {
            font-size: 18px;
            color: #4361ee;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #4361ee;
        }
        
        .upload-btn {
            background: linear-gradient(90deg, #4cc9f0 0%, #3a0ca3 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: block;
            margin: 20px auto;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(76, 201, 240, 0.3);
            display: none;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(76, 201, 240, 0.4);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4361ee;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-container {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f6f9ff 0%, #e6eeff 100%);
            border-radius: 12px;
            border-left: 5px solid #4361ee;
        }
        
        .result-container h3 {
            margin-bottom: 20px;
            color: #4361ee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .result-container h3 i {
            font-size: 24px;
        }
        
        .url-container {
            display: flex;
            margin-bottom: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .url-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            font-size: 16px;
            background: #f9f9f9;
        }
        
        .copy-btn {
            background: #4361ee;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .copy-btn:hover {
            background: #3a0ca3;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .view-btn {
            background: #3a0ca3;
            color: white;
        }
        
        .view-btn:hover {
            background: #2c0880;
            transform: translateY(-2px);
        }
        
        .new-upload {
            background: #f72585;
            color: white;
        }
        
        .new-upload:hover {
            background: #d90166;
            transform: translateY(-2px);
        }
        
        .history {
            margin-top: 40px;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 12px;
        }
        
        .history h3 {
            margin-bottom: 20px;
            color: #4361ee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .history-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .history-url {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 15px;
            font-size: 14px;
        }
        
        .history-actions {
            display: flex;
            gap: 10px;
        }
        
        .history-btn {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }
        
        .history-copy {
            background: #4361ee;
            color: white;
            border: none;
        }
        
        .history-copy:hover {
            background: #3a0ca3;
        }
        
        .history-view {
            background: #3a0ca3;
            color: white;
            text-decoration: none;
        }
        
        .history-view:hover {
            background: #2c0880;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }
        
        .alert-error {
            background-color: #ffebee;
            color: #d32f2f;
            border-left: 5px solid #d32f2f;
        }
        
        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-left: 5px solid #2e7d32;
        }
        
        .file-info {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            display: none;
        }
        
        /* Sosial Media Styles */
        .social-media {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s;
        }
        
        .social-item:hover {
            transform: translateY(-5px);
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .telegram {
            background-color: #0088cc;
        }
        
        .youtube {
            background-color: #ff0000;
        }
        
        .whatsapp {
            background-color: #25D366;
        }
        
        .social-label {
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
            
            .upload-container {
                padding: 30px 15px;
            }
            
            .url-container {
                flex-direction: column;
            }
            
            .url-input {
                border-radius: 0;
                padding: 15px;
                text-align: center;
            }
            
            .copy-btn {
                border-radius: 0;
                justify-content: center;
                padding: 15px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .history-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .history-url {
                margin-right: 0;
                margin-bottom: 10px;
                width: 100%;
            }
            
            .history-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .social-media {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .social-icon {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            
            .social-label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud-upload-alt"></i> Upload Gambar ke URL</h1>
            <p class="description">Unggah gambar dan dapatkan URL untuk dibagikan</p>
        </div>
        
        <div class="content">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>
            
            <div class="upload-container" id="uploadContainer">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <p>Seret dan lepas gambar di sini atau</p>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button class="browse-btn" id="browseBtn"><i class="fas fa-search"></i> Pilih Gambar</button>
                <div class="file-info" id="fileInfo"></div>
            </div>
            
            <div class="preview-container" id="previewContainer">
                <div class="preview-title">Pratinjau Gambar</div>
                <img src="" alt="Preview" class="preview-image" id="previewImage">
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Mengupload gambar...</p>
            </div>
            
            <button class="upload-btn" id="uploadBtn"><i class="fas fa-upload"></i> Upload Gambar</button>
            
            <div class="result-container" id="resultContainer">
                <h3><i class="fas fa-check-circle"></i> Upload Berhasil!</h3>
                <div class="url-container">
                    <input type="text" class="url-input" id="urlInput" readonly>
                    <button class="copy-btn" id="copyBtn"><i class="fas fa-copy"></i> Salin</button>
                </div>
                <div class="action-buttons">
                    <a href="#" class="action-btn view-btn" id="viewBtn" target="_blank"><i class="fas fa-eye"></i> Lihat Gambar</a>
                    <button class="action-btn new-upload" id="newUploadBtn"><i class="fas fa-plus"></i> Upload Baru</button>
                </div>
            </div>
            
            <div class="history" id="historySection">
                <h3><i class="fas fa-history"></i> Riwayat Upload</h3>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- Menu Sosial Media Owner -->
    <div class="social-media">
        <a href="https://t.me/bukan_mastah_id" class="social-item">
            <div class="social-icon telegram">
                <i class="fab fa-telegram"></i>
            </div>
            <span class="social-label">Telegram</span>
        </a>
        <a href="https://youtube.com/@bukan_mastah?si=Y5C7F_SXqHY6Z49H" class="social-item">
            <div class="social-icon youtube">
                <i class="fab fa-youtube"></i>
            </div>
            <span class="social-label">YouTube</span>
        </a>
        <a href="https://whatsapp.com/channel/0029VadnVWwChq6TJ1mp1K3y" class="social-item">
            <div class="social-icon whatsapp">
                <i class="fab fa-whatsapp"></i>
            </div>
            <span class="social-label">WhatsApp</span>
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elemen DOM
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const uploadContainer = document.getElementById('uploadContainer');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');
            const uploadBtn = document.getElementById('uploadBtn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const urlInput = document.getElementById('urlInput');
            const copyBtn = document.getElementById('copyBtn');
            const viewBtn = document.getElementById('viewBtn');
            const newUploadBtn = document.getElementById('newUploadBtn');
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const historyList = document.getElementById('historyList');
            const historySection = document.getElementById('historySection');
            const fileInfo = document.getElementById('fileInfo');
            
            let selectedFile = null;
            
            // Load riwayat dari localStorage
            loadHistory();
            
            // Event listener untuk tombol browse
            browseBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // Event listener untuk input file
            fileInput.addEventListener('change', handleFileSelect);
            
            // Event listener untuk drag and drop
            uploadContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadContainer.classList.add('dragover');
            });
            
            uploadContainer.addEventListener('dragleave', () => {
                uploadContainer.classList.remove('dragover');
            });
            
            uploadContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadContainer.classList.remove('dragover');
                
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            
            // Event listener untuk tombol upload
            uploadBtn.addEventListener('click', uploadImage);
            
            // Event listener untuk tombol salin
            copyBtn.addEventListener('click', copyUrl);
            
            // Event listener untuk tombol upload baru
            newUploadBtn.addEventListener('click', resetForm);
            
            // Fungsi menangani pemilihan file
            function handleFileSelect(e) {
                if (e.target.files.length) {
                    handleFile(e.target.files[0]);
                }
            }
            
            // Fungsi menangani file
            function handleFile(file) {
                if (!file.type.match('image.*')) {
                    showError('Silakan pilih file gambar (JPEG, PNG, GIF, dll.)');
                    return;
                }
                
                // Validasi ukuran file (maksimal 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    showError('Ukuran file terlalu besar. Maksimal 5MB');
                    return;
                }
                
                selectedFile = file;
                
                // Tampilkan info file
                const fileSize = (file.size / 1024 / 1024).toFixed(2);
                fileInfo.textContent = `${file.name} (${fileSize} MB)`;
                fileInfo.style.display = 'block';
                
                // Tampilkan preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewContainer.style.display = 'block';
                    uploadBtn.style.display = 'block';
                };
                reader.readAsDataURL(file);
                
                // Sembunyikan pesan error jika ada
                hideAlerts();
            }
            
            // Fungsi upload gambar
            function uploadImage() {
                if (!selectedFile) {
                    showError('Silakan pilih gambar terlebih dahulu');
                    return;
                }
                
                // Tampilkan loading, sembunyikan tombol upload
                loading.style.display = 'block';
                uploadBtn.style.display = 'none';
                hideAlerts();
                
                // FormData untuk mengirim file
                const formData = new FormData();
                formData.append('file', selectedFile);
                
                // Kirim request ke API tmpfiles.org
                fetch('https://tmpfiles.org/api/v1/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.data && data.data.url) {
                        // Format URL sesuai petunjuk
                        const urlParts = data.data.url.split('/');
                        const id = urlParts[urlParts.length - 2];
                        const filename = urlParts[urlParts.length - 1];
                        const directUrl = `https://tmpfiles.org/dl/${id}/${filename}`;
                        
                        showResult(directUrl);
                        addToHistory(directUrl, selectedFile.name);
                        showSuccess('Gambar berhasil diupload! URL dapat digunakan selama 6 jam.');
                    } else {
                        throw new Error('Upload gagal. Respons tidak valid.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Terjadi kesalahan saat upload: ' + error.message);
                })
                .finally(() => {
                    loading.style.display = 'none';
                });
            }
            
            // Fungsi menampilkan hasil
            function showResult(url) {
                urlInput.value = url;
                viewBtn.href = url;
                resultContainer.style.display = 'block';
                
                // Scroll ke hasil
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }
            
            // Fungsi salin URL
            function copyUrl() {
                urlInput.select();
                document.execCommand('copy');
                
                // Ubah teks tombol sementara
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }
            
            // Fungsi reset form
            function resetForm() {
                fileInput.value = '';
                selectedFile = null;
                previewContainer.style.display = 'none';
                uploadBtn.style.display = 'none';
                resultContainer.style.display = 'none';
                fileInfo.style.display = 'none';
                hideAlerts();
            }
            
            // Fungsi tambahkan ke riwayat
            function addToHistory(url, filename) {
                // Dapatkan riwayat dari localStorage
                let history = JSON.parse(localStorage.getItem('uploadHistory')) || [];
                
                // Tambahkan URL baru ke awal array
                history.unshift({
                    url: url,
                    filename: filename,
                    timestamp: new Date().getTime()
                });
                
                // Simpan maksimal 10 item
                if (history.length > 10) {
                    history = history.slice(0, 10);
                }
                
                // Simpan kembali ke localStorage
                localStorage.setItem('uploadHistory', JSON.stringify(history));
                
                // Perbarui tampilan riwayat
                loadHistory();
            }
            
            // Fungsi muat riwayat
            function loadHistory() {
                const history = JSON.parse(localStorage.getItem('uploadHistory')) || [];
                
                if (history.length === 0) {
                    historySection.style.display = 'none';
                    return;
                }
                
                historySection.style.display = 'block';
                historyList.innerHTML = '';
                
                history.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    
                    const urlText = document.createElement('div');
                    urlText.className = 'history-url';
                    urlText.textContent = item.filename;
                    urlText.title = item.url;
                    
                    const actions = document.createElement('div');
                    actions.className = 'history-actions';
                    
                    const copyButton = document.createElement('button');
                    copyButton.className = 'history-btn history-copy';
                    copyButton.innerHTML = '<i class="fas fa-copy"></i> Salin';
                    copyButton.addEventListener('click', () => {
                        navigator.clipboard.writeText(item.url);
                        copyButton.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                        setTimeout(() => {
                            copyButton.innerHTML = '<i class="fas fa-copy"></i> Salin';
                        }, 2000);
                    });
                    
                    const viewButton = document.createElement('a');
                    viewButton.className = 'history-btn history-view';
                    viewButton.innerHTML = '<i class="fas fa-eye"></i> Lihat';
                    viewButton.href = item.url;
                    viewButton.target = '_blank';
                    
                    actions.appendChild(copyButton);
                    actions.appendChild(viewButton);
                    
                    historyItem.appendChild(urlText);
                    historyItem.appendChild(actions);
                    
                    historyList.appendChild(historyItem);
                });
            }
            
            // Fungsi tampilkan error
            function showError(message) {
                errorAlert.textContent = message;
                errorAlert.style.display = 'block';
                successAlert.style.display = 'none';
                
                // Scroll ke alert
                errorAlert.scrollIntoView({ behavior: 'smooth' });
            }
            
            // Fungsi tampilkan sukses
            function showSuccess(message) {
                successAlert.textContent = message;
                successAlert.style.display = 'block';
                errorAlert.style.display = 'none';
            }
            
            // Fungsi sembunyikan semua alert
            function hideAlerts() {
                errorAlert.style.display = 'none';
                successAlert.style.display = 'none';
            }
        });
    </script>
</body>
</html>
