<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Version Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .result {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            border-radius: 4px;
        }
        .version-code {
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
        .copy-btn {
            background: #28a745;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <h2>Version Code Generator</h2>
    
    <div class="form-group">
        <label>Format:</label>
        <select id="format">
            <option value="yymmddnnnn">YYMMDDNNNN (2102080000)</option>
            <option value="yymmddhhmm">YYMMDDHHMM (2102081430)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tahun (2 digit):</label>
        <input type="number" id="year" min="0" max="99" value="21">
    </div>

    <div class="form-group">
        <label>Bulan (2 digit):</label>
        <input type="number" id="month" min="1" max="12" value="2">
    </div>

    <div class="form-group">
        <label>Tanggal (2 digit):</label>
        <input type="number" id="day" min="1" max="31" value="8">
    </div>

    <div class="form-group">
        <label>Nomor Build (4 digit):</label>
        <input type="number" id="build" min="0" max="9999" value="0">
    </div>

    <button onclick="generateCode()">Generate Kode</button>

    <div class="result">
        <div>Kode Versi:</div>
        <div class="version-code" id="output">2102080000</div>
        <button class="copy-btn" onclick="copyCode()">Copy Kode</button>
    </div>

    <script>
        function generateCode() {
            const format = document.getElementById('format').value;
            const year = document.getElementById('year').value.padStart(2, '0');
            const month = document.getElementById('month').value.padStart(2, '0');
            const day = document.getElementById('day').value.padStart(2, '0');
            const build = document.getElementById('build').value.padStart(4, '0');
            
            let code;
            if (format === 'yymmddhhmm') {
                const hours = new Date().getHours().toString().padStart(2, '0');
                const minutes = new Date().getMinutes().toString().padStart(2, '0');
                code = year + month + day + hours + minutes;
            } else {
                code = year + month + day + build;
            }
            
            document.getElementById('output').textContent = code;
        }

        function copyCode() {
            const code = document.getElementById('output').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Kode disalin: ' + code);
            });
        }

        // Generate kode pertama kali
        generateCode();
    </script>
</body>
</html>
